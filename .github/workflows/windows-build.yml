name: Windows Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'master'
    
    - name: Install dependencies via vcpkg
      run: |
        vcpkg install boost:x64-windows
        vcpkg install guile:x64-windows
        vcpkg integrate install
    
    - name: Build OCC
      run: |
        .\build-windows.ps1 -BuildAllComponents
      shell: powershell
    
    - name: Generate Chocolatey Package
      run: |
        .\package-chocolatey.ps1
      shell: powershell
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: occ-windows-build
        path: |
          build/Release/*.exe
          build/Release/*.dll
          opencog-*.zip
    
    - name: Upload Chocolatey Package
      uses: actions/upload-artifact@v3
      with:
        name: chocolatey-package
        path: |
          packaging/chocolatey/*.nupkg
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          opencog-*.zip
          packaging/chocolatey/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
