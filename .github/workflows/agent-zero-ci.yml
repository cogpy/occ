---
name: Agent-Zero CI Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'agents/**'
      - '.github/workflows/agent-zero-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agents/**'
      - '.github/workflows/agent-zero-ci.yml'
  workflow_dispatch:
    inputs:
      enable_coverage:
        description: 'Enable code coverage analysis'
        required: false
        default: 'true'
        type: boolean
      enable_docker:
        description: 'Build Docker images'
        required: false
        default: 'true'
        type: boolean
      enable_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  packages: write

env:
  # Build configuration
  CMAKE_BUILD_TYPE: Release
  BUILD_TESTING: ON
  BUILD_EXAMPLES: ON
  BUILD_DOCS: OFF

  # Agent-Zero specific settings
  AGENT_ZERO_VERSION: 0.2.0

  # Docker settings
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}/agent-zero

jobs:
  # ==== Foundation: Build OpenCog Dependencies (Matrix) ====
  build-opencog-dependencies:
    name: Build OpenCog Dependencies (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            pkg-config \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            cython3 \
            python3-nose \
            python3-dev \
            python3-pip \
            valgrind \
            doxygen

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install cython numpy

      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-opencog-deps

      - name: Build and install cogutil
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd cogutil
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build and install atomspace
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd atomspace
          # Create missing lib directory if needed
          if [ ! -d "lib" ]; then
            mkdir -p lib
            echo "# Empty lib directory for build compatibility" > lib/CMakeLists.txt
          fi
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build and install cogserver
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd cogserver
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Cache OpenCog installation
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}

  # ==== Build Agent-Zero Core (Matrix) ====
  build-agent-zero-core:
    name: Build Agent-Zero Core (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    needs: [build-opencog-dependencies]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            pkg-config \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            cython3 \
            python3-nose \
            python3-dev \
            python3-pip

      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Restore OpenCog dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}

      - name: Update library cache
        run: sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-agent-zero-core

      - name: Configure Agent-Zero Core
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd agents/cpp/agentzero-core
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=${{ env.BUILD_TESTING }}

      - name: Build Agent-Zero Core
        run: |
          cd agents/cpp/agentzero-core/build
          make -j$(nproc)

      - name: Run Agent-Zero Core tests
        run: |
          cd agents/cpp/agentzero-core/build
          ctest --output-on-failure --verbose

      - name: Install Agent-Zero Core
        run: |
          cd agents/cpp/agentzero-core/build
          sudo make install
          sudo ldconfig

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-zero-core-build-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            agents/cpp/agentzero-core/build/
          retention-days: 7

  # ==== Build Agent-Zero Full System (Matrix) ====
  build-agent-zero-full:
    name: Build Agent-Zero Full System (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    needs: [build-agent-zero-core]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            pkg-config \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            cython3 \
            python3-nose \
            python3-dev \
            python3-pip

      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Restore OpenCog dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}

      - name: Update library cache
        run: sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-agent-zero-full

      - name: Configure Agent-Zero Full System
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd agents
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=${{ env.BUILD_TESTING }} \
            -DBUILD_EXAMPLES=${{ env.BUILD_EXAMPLES }} \
            -DBUILD_DOCS=${{ env.BUILD_DOCS }}

      - name: Build Agent-Zero Full System
        run: |
          cd agents/build
          make -j$(nproc)

      - name: Run Agent-Zero tests
        run: |
          cd agents/build
          ctest --output-on-failure --verbose
        continue-on-error: true

      - name: Install Agent-Zero
        run: |
          cd agents/build
          sudo make install
          sudo ldconfig

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-zero-full-build-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            agents/build/
          retention-days: 7

  # ==== Code Coverage Analysis ====
  code-coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-22.04
    needs: [build-opencog-dependencies]
    if: ${{ github.event.inputs.enable_coverage != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            cython3 \
            python3-nose \
            python3-dev \
            python3-pip \
            lcov \
            gcovr

      - name: Restore OpenCog dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-ubuntu-22.04-gcc-${{ github.sha }}

      - name: Update library cache
        run: sudo ldconfig

      - name: Configure with coverage flags
        run: |
          cd agents/cpp/agentzero-core
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DBUILD_TESTING=ON

      - name: Build with coverage
        run: |
          cd agents/cpp/agentzero-core/build
          make -j$(nproc)

      - name: Run tests for coverage
        run: |
          cd agents/cpp/agentzero-core/build
          ctest --output-on-failure || true

      - name: Generate coverage report (lcov)
        run: |
          cd agents/cpp/agentzero-core/build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch || true
          lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage.info --ignore-errors mismatch || true
          lcov --list coverage.info || true

      - name: Generate coverage report (gcovr)
        run: |
          cd agents/cpp/agentzero-core
          gcovr --root . --html --html-details -o build/coverage.html || true
          gcovr --root . --xml -o build/coverage.xml || true
          gcovr --root . || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            agents/cpp/agentzero-core/build/coverage.info
            agents/cpp/agentzero-core/build/coverage.html
            agents/cpp/agentzero-core/build/coverage*.html
            agents/cpp/agentzero-core/build/coverage.xml
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cd agents/cpp/agentzero-core/build
          if [ -f coverage.info ]; then
            lcov --summary coverage.info 2>/dev/null || echo "Coverage data generated"
          fi

  # ==== Static Analysis ====
  static-analysis:
    name: Static Analysis (cppcheck & clang-tidy)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck \
            clang-tidy \
            clang-format \
            jq

      - name: Run cppcheck
        run: |
          echo "## Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### cppcheck" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cppcheck \
            --enable=all \
            --inconclusive \
            --force \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --std=c++17 \
            --xml \
            --xml-version=2 \
            agents/cpp/ 2>&1 | tee cppcheck-report.xml || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate cppcheck summary
        run: |
          if [ -f cppcheck-report.xml ]; then
            echo "### cppcheck Summary" >> $GITHUB_STEP_SUMMARY
            error_count=$(grep -c "<error " cppcheck-report.xml 2>/dev/null || echo "0")
            echo "- Total issues found: $error_count" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run clang-tidy (sample check)
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### clang-tidy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find agents/cpp -name "*.cpp" -type f | head -20 | while read file; do
            clang-tidy "$file" \
              --checks='*,-llvm*,-fuchsia*,-google-readability-todo,-altera*,-modernize-use-trailing-return-type' \
              -- -std=c++17 -I/usr/local/include 2>/dev/null || true
          done | head -100
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Check code formatting
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Formatting (clang-format)" >> $GITHUB_STEP_SUMMARY
          cd agents/cpp
          formatting_issues=$(find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror 2>&1 | wc -l || echo "0")
          if [ "$formatting_issues" -gt 0 ]; then
            echo "- ⚠️ $formatting_issues formatting issues detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Code formatting is consistent" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.xml
          retention-days: 30

  # ==== Performance Benchmarks ====
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    needs: [build-agent-zero-full]
    if: ${{ github.event.inputs.enable_benchmarks != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            python3-dev \
            python3-pip \
            time

      - name: Restore OpenCog dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-ubuntu-22.04-gcc-${{ github.sha }}

      - name: Update library cache
        run: sudo ldconfig

      - name: Build with optimizations
        run: |
          cd agents/cpp/agentzero-core
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=native" \
            -DBUILD_TESTING=ON
          make -j$(nproc)

      - name: Run performance tests
        run: |
          cd agents/cpp/agentzero-core/build
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "- Build completed on $(nproc) cores" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite Timing" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          /usr/bin/time -v ctest --output-on-failure 2>&1 | tail -20 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Memory profiling
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Memory Usage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          free -h
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Store benchmark results
        run: |
          mkdir -p benchmark-results
          echo "{" > benchmark-results/results.json
          echo '  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",' >> benchmark-results/results.json
          echo '  "commit": "${{ github.sha }}",' >> benchmark-results/results.json
          echo '  "branch": "${{ github.ref_name }}",' >> benchmark-results/results.json
          echo '  "cores": '$(nproc)',' >> benchmark-results/results.json
          echo '  "memory_mb": '$(free -m | awk 'NR==2{print $2}')'' >> benchmark-results/results.json
          echo "}" >> benchmark-results/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 90

  # ==== Docker Build ====
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-22.04
    needs: [build-agent-zero-full]
    if: ${{ github.event.inputs.enable_docker != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.agent-zero << 'EOF'
          # Agent-Zero Docker Image
          FROM ubuntu:22.04 AS builder

          ENV DEBIAN_FRONTEND=noninteractive

          # Install build dependencies
          RUN apt-get update && apt-get install -y \
              build-essential \
              cmake \
              pkg-config \
              git \
              libboost-all-dev \
              librocksdb-dev \
              liboctomap-dev \
              libssl-dev \
              guile-3.0-dev \
              cython3 \
              python3-nose \
              python3-dev \
              python3-pip \
              && rm -rf /var/lib/apt/lists/*

          # Copy source
          WORKDIR /build
          COPY . .

          # Build cogutil
          RUN cd cogutil && mkdir -p build && cd build && \
              cmake .. -DCMAKE_BUILD_TYPE=Release && \
              make -j$(nproc) && make install && ldconfig

          # Build atomspace
          RUN cd atomspace && \
              ([ -d "lib" ] || (mkdir -p lib && echo "# Empty" > lib/CMakeLists.txt)) && \
              mkdir -p build && cd build && \
              cmake .. -DCMAKE_BUILD_TYPE=Release && \
              make -j$(nproc) && make install && ldconfig

          # Build cogserver
          RUN cd cogserver && mkdir -p build && cd build && \
              cmake .. -DCMAKE_BUILD_TYPE=Release && \
              make -j$(nproc) && make install && ldconfig

          # Build Agent-Zero
          RUN cd agents && mkdir -p build && cd build && \
              cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && \
              make -j$(nproc) && make install && ldconfig

          # Runtime stage
          FROM ubuntu:22.04

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y \
              libboost-system1.74.0 \
              libboost-filesystem1.74.0 \
              libboost-thread1.74.0 \
              libboost-program-options1.74.0 \
              librocksdb7.8 \
              liboctomap1.9 \
              libssl3 \
              guile-3.0-libs \
              python3 \
              && rm -rf /var/lib/apt/lists/*

          # Copy installed libraries
          COPY --from=builder /usr/local/lib /usr/local/lib
          COPY --from=builder /usr/local/include /usr/local/include
          COPY --from=builder /usr/local/bin /usr/local/bin

          RUN ldconfig

          # Set working directory
          WORKDIR /app

          # Default command
          CMD ["bash"]
          EOF

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.AGENT_ZERO_VERSION }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-zero
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker image summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ==== Test Agent-Zero Demonstrations ====
  test-demonstrations:
    name: Test Agent-Zero Demonstrations
    runs-on: ubuntu-latest
    needs: [build-agent-zero-full]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            git \
            libboost-all-dev \
            librocksdb-dev \
            liboctomap-dev \
            libssl-dev \
            guile-3.0-dev \
            cython3 \
            python3-nose \
            python3-dev \
            python3-pip

      - name: Restore OpenCog dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib
            /usr/local/include
            /usr/local/lib/pkgconfig
          key: opencog-deps-${{ runner.os }}-${{ github.sha }}

      - name: Update library cache
        run: sudo ldconfig

      - name: Install Python dependencies for validation
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pyyaml

      - name: Validate demonstrations
        run: |
          cd agents/demonstrations
          if [ -f "validate_demos.py" ]; then
            python3 validate_demos.py
          else
            echo "No validation script found, skipping..."
          fi
        continue-on-error: true

      - name: Run demonstration scripts
        run: |
          cd agents/demonstrations
          if [ -f "run_all_demos.sh" ]; then
            chmod +x run_all_demos.sh
            ./run_all_demos.sh || echo "Some demonstrations failed (expected in CI)"
          else
            echo "No demo runner script found, skipping..."
          fi
        continue-on-error: true

      - name: Upload demonstration results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demonstration-results
          path: |
            agents/demonstrations/*.log
            agents/demonstrations/*.json
          retention-days: 7

  # ==== Code Quality Checks ====
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C++ code formatting
        run: |
          cd agents
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror || \
            echo "Code formatting issues found (non-blocking)"
        continue-on-error: true

      - name: Check for TODO/FIXME comments
        run: |
          cd agents
          echo "=== TODO/FIXME Summary ==="
          grep -r "TODO\|FIXME" --include="*.cpp" --include="*.h" --include="*.hpp" . || \
            echo "No TODO/FIXME comments found"

      - name: Generate code statistics
        run: |
          cd agents
          echo "=== Code Statistics ==="
          echo "C++ files:"
          find . -name "*.cpp" | wc -l
          echo "Header files:"
          find . -name "*.h" -o -name "*.hpp" | wc -l
          echo "Total lines of code:"
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs wc -l | tail -1

  # ==== Build Summary Report ====
  build-summary:
    name: Build Summary Report
    runs-on: ubuntu-latest
    needs: [build-agent-zero-full, test-demonstrations, code-quality, code-coverage, static-analysis, performance-benchmarks, docker-build]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "# Agent-Zero CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Agent-Zero Version:** ${{ env.AGENT_ZERO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Matrix Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Compiler | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-22.04 | gcc | ${{ needs.build-agent-zero-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-22.04 | clang | ${{ needs.build-agent-zero-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-20.04 | gcc | ${{ needs.build-agent-zero-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-20.04 | clang | ${{ needs.build-agent-zero-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| OpenCog Dependencies | ${{ needs.build-opencog-dependencies.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent-Zero Core | ${{ needs.build-agent-zero-core.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent-Zero Full | ${{ needs.build-agent-zero-full.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Demonstrations | ${{ needs.test-demonstrations.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage | ${{ needs.code-coverage.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Benchmarks | ${{ needs.performance-benchmarks.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Build artifacts for each matrix configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports (if enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis reports" >> $GITHUB_STEP_SUMMARY
          echo "- Performance benchmark results" >> $GITHUB_STEP_SUMMARY
          echo "- Demonstration logs" >> $GITHUB_STEP_SUMMARY

      - name: Check overall build status
        run: |
          if [[ "${{ needs.build-agent-zero-full.result }}" == "success" ]]; then
            echo "✅ Agent-Zero build completed successfully!"
            exit 0
          else
            echo "❌ Agent-Zero build failed or was cancelled"
            exit 1
          fi
