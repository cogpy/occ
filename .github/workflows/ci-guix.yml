# OpenCog Collection (OCC) - Guix CI Build
#
# 1. Scheme syntax validation of the Guix files (fast).
# 2. A real `guix build -f guix.scm` with the GNU Guix 1.5.0 release,
#    installed from its signed binary tarball. Component sources are
#    watched too, since guix.scm builds them. guix-simple.scm is
#    syntax-checked only.

name: Guix Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'guix.scm'
      - 'guix-simple.scm'
      - '*.scm'
      - '.github/workflows/ci-guix.yml'
      - 'cogutil/**'
      - 'atomspace/**'
      - 'atomspace-storage/**'
      - 'atomspace-rocks/**'
      - 'cogserver/**'
      - 'matrix/**'
      - 'unify/**'
      - 'ure/**'
      - 'sensory/**'
      - 'lg-atomese/**'
      - 'learn/**'
      - 'agents/**'
      - 'coggml/**'
      - 'cogself/**'
      - 'attention/**'
      - 'spacetime/**'
      - 'pln/**'
      - 'miner/**'
      - 'moses/**'
      - 'asmoses/**'
      - 'atomspace-cog/**'
      - 'atomspace-pgres/**'
      - 'atomspace-bridge/**'
      - 'atomspace-metta/**'
      - 'atomspace-rpc/**'
      - 'atomspace-restful/**'
      - 'pattern-index/**'
      - 'generate/**'
      - 'agi-bio/**'
      - 'cheminformatics/**'
      - 'vision/**'
      - 'visualization/**'
      - 'atomese-simd/**'
      - 'opencog/**'
      - 'agentic-chatbots/**'
      - 'atomspace-accelerator/**'
      - 'entelechy/**'
      - 'synergy/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'guix.scm'
      - 'guix-simple.scm'
      - '*.scm'
      - '.github/workflows/ci-guix.yml'
      - 'cogutil/**'
      - 'atomspace/**'
      - 'atomspace-storage/**'
      - 'atomspace-rocks/**'
      - 'cogserver/**'
      - 'matrix/**'
      - 'unify/**'
      - 'ure/**'
      - 'sensory/**'
      - 'lg-atomese/**'
      - 'learn/**'
      - 'agents/**'
      - 'coggml/**'
      - 'cogself/**'
      - 'attention/**'
      - 'spacetime/**'
      - 'pln/**'
      - 'miner/**'
      - 'moses/**'
      - 'asmoses/**'
      - 'atomspace-cog/**'
      - 'atomspace-pgres/**'
      - 'atomspace-bridge/**'
      - 'atomspace-metta/**'
      - 'atomspace-rpc/**'
      - 'atomspace-restful/**'
      - 'pattern-index/**'
      - 'generate/**'
      - 'agi-bio/**'
      - 'cheminformatics/**'
      - 'vision/**'
      - 'visualization/**'
      - 'atomese-simd/**'
      - 'opencog/**'
      - 'agentic-chatbots/**'
      - 'atomspace-accelerator/**'
      - 'entelechy/**'
      - 'synergy/**'
  workflow_dispatch:
    inputs:
      update_channels:
        description: 'Run guix pull before building (slow, can hang - only if needed)'
        required: false
        default: false
        type: boolean

concurrency:
  group: guix-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-validation:
    name: Scheme Syntax Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Guile
      run: |
        sudo apt-get update
        sudo apt-get install -y guile-3.0

    - name: Validate Scheme Syntax
      run: |
        echo "## Guix/Scheme Syntax Validation" >> $GITHUB_STEP_SUMMARY
        
        ERRORS=0
        FILES_CHECKED=0
        
        # Guix package definition files (guix.scm, etc.) use Guix-specific modules
        # that aren't available with plain Guile. We validate them by checking
        # they can be parsed as valid S-expressions, not fully loaded.
        # Plain Guile doesn't know G-expression syntax (#~ #$ #$@ #+ #+@), which
        # (guix gexp) normally registers, so register stand-in readers first.
        cat > "$RUNNER_TEMP/read-guix.scm" <<'EOF'
        (define (read-ungexp tag splice-tag)
          (lambda (chr port)
            (if (eqv? (peek-char port) #\@)
                (begin (read-char port) (list splice-tag (read port)))
                (list tag (read port)))))
        (read-hash-extend #\~ (lambda (chr port) (list 'gexp (read port))))
        (read-hash-extend #\$ (read-ungexp 'ungexp 'ungexp-splicing))
        (read-hash-extend #\+ (read-ungexp 'ungexp-native 'ungexp-native-splicing))
        (with-input-from-file (cadr (command-line))
          (lambda ()
            (let loop ()
              (unless (eof-object? (read))
                (loop)))))
        EOF

        for scm_file in guix.scm guix-simple.scm occ-hurdcog-unified.scm; do
          if [ -f "$scm_file" ]; then
            FILES_CHECKED=$((FILES_CHECKED + 1))
            echo "Checking $scm_file..."
            
            # Use Guile's reader to parse as S-expressions without evaluating
            # This validates Scheme syntax without requiring Guix modules
            if guile --no-auto-compile "$RUNNER_TEMP/read-guix.scm" "$scm_file" 2>&1; then
              echo "✅ $scm_file - Valid Scheme syntax"
              echo "- ✅ \`$scm_file\` (Guix package definition)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $scm_file - Syntax error"
              echo "- ❌ \`$scm_file\`" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi
          fi
        done
        
        # Check synergy scheme files (these are pure Guile, can be loaded)
        if [ -d "synergy" ]; then
          for scm_file in $(find synergy -name "*.scm" -type f 2>/dev/null | head -20); do
            FILES_CHECKED=$((FILES_CHECKED + 1))
            if guile -c "(load \"$scm_file\")" 2>/dev/null; then
              echo "✅ $scm_file"
            else
              echo "⚠️ $scm_file - Has issues (non-blocking)"
            fi
          done
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Total files checked:** $FILES_CHECKED" >> $GITHUB_STEP_SUMMARY
        echo "**Errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY
        
        if [ $ERRORS -gt 0 ]; then
          echo "::error::Found $ERRORS Scheme syntax errors in core files"
          exit 1
        fi

    - name: Run Guix Syntax Test Script
      run: |
        if [ -x "./test-guix-syntax.sh" ]; then
          ./test-guix-syntax.sh || echo "Syntax test script had warnings"
        fi
      continue-on-error: true

  guix-build:
    name: Guix Build
    runs-on: ubuntu-22.04
    needs: syntax-validation
    timeout-minutes: 180
    env:
      GUIX_VERSION: "1.5.0"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        # The Guix store needs several GB; drop large toolchains we don't use.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install Guix
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        tarball="guix-binary-${GUIX_VERSION}.x86_64-linux.tar.xz"
        curl -sSfO "https://ftp.gnu.org/gnu/guix/${tarball}"
        curl -sSfO "https://ftp.gnu.org/gnu/guix/${tarball}.sig"

        # Verify the release signature against the Guix release signing keys
        # listed in the official installer (etc/guix-install.sh).
        export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
        keys="3CE464558A84FDC69DB40CFB090B11993D9AEBB5 27D586A4F8900854329FF09F1260E46482E63562 A28BF40C3E551372662D14F741AAE7DCCA3D8351"
        for fpr in $keys; do
          curl -sSf "https://keys.openpgp.org/vks/v1/by-fingerprint/$fpr" | gpg --import || true
        done
        signer=$(gpg --status-fd 1 --verify "${tarball}.sig" "$tarball" 2>/dev/null \
                   | awk '$2 == "VALIDSIG" {print $NF}')
        if [ -z "$signer" ] || ! echo " $keys " | grep -q " $signer "; then
          echo "::error::Guix release signature could not be verified"
          exit 1
        fi
        echo "Release signed by $signer"

        # Unpack and set up the daemon, following the manual's binary install.
        # Unpack as root: the store must be owned by root, not the runner user.
        mkdir unpack && sudo tar --warning=no-timestamp -xf "$tarball" -C unpack
        sudo mv unpack/var/guix /var/ && sudo mv unpack/gnu /
        G=/var/guix/profiles/per-user/root/current-guix
        sudo mkdir -p ~root/.config/guix && sudo ln -sf $G ~root/.config/guix/current
        sudo groupadd --system guixbuild
        for i in $(seq -w 1 4); do
          sudo useradd -g guixbuild -G guixbuild -d /var/empty -s "$(command -v nologin)" \
            -c "Guix build user $i" --system "guixbuilder$i"
        done
        for k in ci.guix.gnu.org bordeaux.guix.gnu.org; do
          sudo $G/bin/guix archive --authorize < $G/share/guix/$k.pub
        done
        sudo nohup $G/bin/guix-daemon --build-users-group=guixbuild > "$RUNNER_TEMP/guix-daemon.log" 2>&1 &
        for i in $(seq 1 30); do [ -S /var/guix/daemon-socket/socket ] && break; sleep 1; done
        echo "$G/bin" >> "$GITHUB_PATH"
        $G/bin/guix --version | head -1

    # guix pull can hang the runner for hours, so it only runs on explicit opt-in
    - name: Update Guix Channels
      if: inputs.update_channels == true
      timeout-minutes: 30
      run: |
        guix pull --verbosity=1
        echo "$HOME/.config/guix/current/bin" >> "$GITHUB_PATH"
        guix describe

    - name: Build with Guix
      run: |
        echo "## Guix Build ($(guix --version | head -1))" >> "$GITHUB_STEP_SUMMARY"
        FAILED=0
        # guix-simple.scm is only syntax-checked: it was never buildable (it
        # quasi-quotes its phases and copies the whole checkout).
        for scm_file in guix.scm; do
          [ -f "$scm_file" ] || continue
          echo "::group::guix build -f $scm_file"
          # PIPESTATUS keeps guix's exit code, which `| tee` would otherwise hide.
          guix build -f "$scm_file" --cores="$(nproc)" --max-jobs=2 --keep-going \
            2>&1 | tee -a guix-build.log
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "- ✅ \`$scm_file\` built" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ \`$scm_file\` failed" >> "$GITHUB_STEP_SUMMARY"
            FAILED=1
          fi
        done
        # Which packages failed, if any (from --keep-going output).
        grep -oE "build of /gnu/store/[a-z0-9]+-[^ ]+\.drv failed" guix-build.log \
          | sed -E 's|build of /gnu/store/[a-z0-9]+-||; s|\.drv failed||; s|^|  - ❌ |' \
          >> "$GITHUB_STEP_SUMMARY" || true
        exit $FAILED

    - name: Upload Build Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: guix-build-logs
        path: |
          guix-build.log
        retention-days: 7
        if-no-files-found: ignore

  summary:
    name: Guix CI Summary
    runs-on: ubuntu-22.04
    needs: [syntax-validation, guix-build]
    if: always()

    steps:
    - name: Generate Summary
      run: |
        echo "## Guix CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status | Required |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
        echo "| Syntax Validation | ${{ needs.syntax-validation.result }} | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
        echo "| Guix Build | ${{ needs.guix-build.result }} | ✅ Yes |" >> $GITHUB_STEP_SUMMARY

    - name: Check Required Results
      run: |
        if [ "${{ needs.syntax-validation.result }}" != "success" ]; then
          echo "::error::Scheme syntax validation did not succeed"
          exit 1
        fi
        if [ "${{ needs.guix-build.result }}" != "success" ]; then
          echo "::error::guix build did not succeed"
          exit 1
        fi
        echo "Guix CI completed (syntax validated, guix.scm built)"
